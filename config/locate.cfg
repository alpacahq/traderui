# Alpaca Locate FIX 4.2 session over mutual TLS.
#
# Run with:
#   ./bin/traderui -file-store -clordid-prefix "$(date +%s)-" config/locate.cfg
#
# The acceptor keeps sequence numbers, so do not set ResetOnLogon, and use
# -file-store so this client resumes its own sequence numbers across restarts.
# Put the PEM files under certs/ (ignored by git) or change the paths below.
[DEFAULT]
# Port-forward the Locate service to 5001, or point at the Locate endpoint directly.
SocketConnectHost=127.0.0.1
SocketConnectPort=5001
HeartBtInt=30
ReconnectInterval=10
# The client sends as the customer CompID and targets the Alpaca acceptor.
SenderCompID=TEST
TargetCompID=APCA
FileStorePath=tmp/locate
FileLogPath=tmp/locate

SocketUseSSL=Y
SocketMinimumTLSVersion=TLS12
# CA that signed the server certificate.
SocketCAFile=certs/server-ca.crt
# Client certificate and key, issued by the acceptor's client CA.
SocketCertificateFile=certs/client.crt
SocketPrivateKeyFile=certs/client.key
# DNS name on the server certificate.
SocketServerName=locate.example.com

[SESSION]
BeginString=FIX.4.2
